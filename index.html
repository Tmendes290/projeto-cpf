<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGU — Repotenciamento do TCLD</title>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  /* Site enxuto, só a PGU — sem o menu lateral do painel "0 Site PGU" */
  .main{ margin-left:0; }
  .topbar__brand{ display:flex; align-items:center; gap:10px; }
  .topbar__brand-mark{ width:38px; height:38px; border-radius:8px; object-fit:contain; flex-shrink:0; }
</style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div class="topbar__brand">
      <img class="topbar__brand-mark" src="assets/images/squad-cpf-logo.png" alt="Squad CPF">
      <div>
        <div class="topbar__title">PGU — Repotenciamento do TCLD</div>
        <div class="topbar__subtitle">Acompanhamento de campo e planejamento da Parada Geral de Usina</div>
      </div>
    </div>
    <div class="topbar__meta">
      <div id="statusPills"></div>
      <button type="button" class="btn-refresh" id="btnAtualizar">🔄 Atualizar</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/data/pgu.data.js"></script>
<script src="assets/js/pages/pgu.js"></script>
</body>
</html>
